<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Code Executor</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container">
    <h1 class="mb-5 mb-5 text-center">CODE EXECUTOR</h1>
    <div class="row w-100">
        <div class="col-md-6 border-right">
            <form action="/tasks/save" method="post">
                <div class="form-group">
                    <input type="text" class="form-control" name="name" placeholder="Task Title" required th:value="${taskName}">
                </div>
                <div class="form-group">
                    <textarea class="form-control" name="expression" placeholder="Code" required th:text="${expression}"></textarea>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="submit" formaction="/tasks/execute" class="btn btn-success">Run</button>
                </div>
            </form>
            <h2 class="text-center mt-4">Task List</h2>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center" th:each="task : ${tasks}">
                    <span th:text="${task.name}"></span>
                    <div>
                        <form action="/tasks/load" method="post" class="d-inline">
                            <input type="hidden" name="taskId" th:value="${task.id}">
                            <button type="submit" class="btn btn-primary btn-sm">Load</button>
                        </form>
                        <form action="/tasks/delete" method="post" class="d-inline">
                            <input type="hidden" name="taskId" th:value="${task.id}">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>

                </li>
            </ul>
        </div>
        <div class="col-md-6">
            <h2 class="text-center mb-4">Result</h2>
            <div class="result">
                <h3 class="mb-3">Executed code: <span th:text="${taskName}"></span></h3>
                <p class="mb-0">Result: <span th:text="${result}"></span></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
